name: Deploy WordPress Theme

on:
  push:
    branches:
      - main
    paths:
      - "wp-content/themes/sadgemore/**"
      - ".github/workflows/deploy.yml"

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.KRYSTAL_SSH_KEY }}
          SSH_HOST: ${{ secrets.KRYSTAL_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s' "$SSH_PRIVATE_KEY" | base64 --decode > ~/.ssh/krystal
          chmod 600 ~/.ssh/krystal

          ssh-keyscan -p 722 "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy to Krystal
        env:
          SSH_HOST: ${{ secrets.KRYSTAL_HOST }}
          SSH_USER: ${{ secrets.KRYSTAL_USERNAME }}
        run: |
          set -euo pipefail

          REMOTE="$SSH_USER@$SSH_HOST"
          DEST="/home/bbdeeaad/public_html/wp-content/themes/sadgemore/"

          echo "Creating live theme directory..."
          ssh -i ~/.ssh/krystal -p 722 -o IdentitiesOnly=yes "$REMOTE" "mkdir -p '$DEST'"

          echo "Deploying theme from GitHub checkout..."
          rsync -az --delete --itemize-changes \
            -e "ssh -i ~/.ssh/krystal -p 722 -o IdentitiesOnly=yes" \
            wp-content/themes/sadgemore/ \
            "$REMOTE:$DEST"

          echo "Verifying deployed theme..."
          ssh \
            -i ~/.ssh/krystal \
            -p 722 \
            -o IdentitiesOnly=yes \
            "$REMOTE" << 'EOF'
          set -e

          WP_PATH="/home/bbdeeaad/public_html"
          THEME_PATH="$WP_PATH/wp-content/themes/sadgemore"

          test -f "$THEME_PATH/style.css"
          test -d "$THEME_PATH/page-templates"

          cd "$WP_PATH"
          wp cache flush || true
          wp theme activate sadgemore
          wp theme list

          echo "Deployment complete."
          EOF
